name: Inspect synthetic buyer fields read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mp-sandbox-payment-smoke.yml']
permissions: {}
jobs:
  inspect-synthetic-buyer:
    if: github.event.head_commit.message == 'Inspect synthetic buyer fields once 20261030T1325'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read known synthetic buyer once
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN_ASSINATURA_DEV }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """Single read-only compatibility probe; endpoint not officially confirmed.
          No fallback, no impersonation, no mutation. Buyer ID is a public synthetic fixture.
          """
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          
          BUYER_ID = '3805193692'
          
          
          def stop(reason):
              print('result=' + reason)
              raise SystemExit(1)
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def main():
              token = os.environ.get('MP_ACCESS_TOKEN', '')
              if not token or not token.isascii() or '\r' in token or '\n' in token:
                  stop('credential_unusable')
              req = urllib.request.Request('https://api.mercadopago.com/users/' + BUYER_ID,
                  method='GET', headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception:
                  stop('transport_failure_no_retry')
              try:
                  with response:
                      status = response.status
                      body = response.read(1024 * 1024 + 1)
                  print('http_status=' + str(status))
                  if status != 200 or len(body) > 1024 * 1024:
                      stop('http_or_size_failure_no_retry')
                  data = json.loads(body)
              except (ValueError, UnicodeError, OSError):
                  stop('response_unreadable_no_retry')
              if not isinstance(data, dict):
                  stop('response_not_object')
              identifier = data.get('id')
              id_match = type(identifier) in (int, str) and str(identifier) == BUYER_ID
              tags = data.get('tags')
              tags_valid = isinstance(tags, list) and all(isinstance(t, str) for t in tags)
              is_test = tags_valid and 'test_user' in tags
              is_brazil = data.get('site_id') == 'MLB'
              email = data.get('email')
              email_valid = (isinstance(email, str) and len(email) <= 254
                  and re.fullmatch(r'[^\s@]+@[^\s@]+\.[^\s@]+', email) is not None)
              print('known_buyer_id_match=' + str(id_match).lower())
              print('tags_schema_valid=' + str(tags_valid).lower())
              print('test_user_confirmed=' + str(is_test).lower())
              print('site_mlb_confirmed=' + str(is_brazil).lower())
              print('has_email_field=' + str('email' in data).lower())
              print('email_type_string=' + str(isinstance(email, str)).lower())
              print('email_syntax_valid=' + str(email_valid).lower())
              print('mutations_performed=false')
              if not id_match or not is_test or not is_brazil:
                  stop('known_brazil_test_buyer_not_confirmed')
              print('result=known_test_buyer_readonly_classification_complete')
          
          
          if __name__ == '__main__':
              main()
          PYCODE
