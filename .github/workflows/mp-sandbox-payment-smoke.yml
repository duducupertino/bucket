name: Official synthetic standalone payment
on:
  workflow_dispatch:
permissions: {}
jobs:
  single-synthetic-payment:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One synthetic Payments API test
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN_ASSINATURA_DEV }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """One synthetic Payments API smoke; not subscription or production checkout QA."""
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import uuid
          
          BASE = 'https://api.mercadopago.com'
          LIMIT = 1024 * 1024
          PAYER = 'test_payer@example.com'
          
          
          def stop(reason):
              print('result=' + reason)
              raise SystemExit(1)
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def report_mode(stage, data):
              print(stage + '_live_mode_present=' + str('live_mode' in data).lower())
              print(stage + '_live_mode_type_valid=' + str(type(data.get('live_mode')) is bool).lower())
              print(stage + '_live_mode_true=' + str(data.get('live_mode') is True).lower())
              print(stage + '_live_mode_false=' + str(data.get('live_mode') is False).lower())
          
          
          def main():
              token = os.environ.get('MP_ACCESS_TOKEN', '')
              run = os.environ.get('GITHUB_RUN_ID', '')
              if not token or not token.isascii() or '\r' in token or '\n' in token:
                  stop('credential_unusable')
              if not re.fullmatch(r'[0-9]+', run):
                  stop('run_identifier_required')
              reference = 'official-synthetic-smoke-' + run
              key = str(uuid.uuid5(uuid.NAMESPACE_URL, 'https://github.com/duducupertino/bucket/actions/runs/' + run + '/official-synthetic-payment'))
              opener = urllib.request.build_opener(NoRedirect())
          
              def api(stage, method, path, payload=None):
                  if not ((method, path) in {('GET', '/users/me'), ('POST', '/v1/card_tokens'), ('POST', '/v1/payments')}
                          or (method == 'GET' and re.fullmatch(r'/v1/payments/[0-9]+', path))):
                      stop('endpoint_not_allowed')
                  headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
                  data = None
                  if payload is not None:
                      headers['Content-Type'] = 'application/json'
                      data = json.dumps(payload).encode()
                  if (method, path) == ('POST', '/v1/payments'):
                      headers['X-Idempotency-Key'] = key
                  req = urllib.request.Request(BASE + path, method=method, headers=headers, data=data)
                  try:
                      response = opener.open(req, timeout=30)
                  except urllib.error.HTTPError as error:
                      response = error
                  except Exception:
                      stop(stage + '_transport_uncertain_no_retry')
                  try:
                      with response:
                          status = response.status
                          raw = response.read(LIMIT + 1)
                      print(stage + '_http_status=' + str(status))
                      if len(raw) > LIMIT:
                          stop(stage + '_response_too_large')
                      obj = json.loads(raw)
                      if not isinstance(obj, dict):
                          stop(stage + '_invalid_response')
                  except (ValueError, UnicodeError, OSError):
                      stop(stage + '_response_unreadable')
                  expected = (200,) if method == 'GET' else (201,)
                  if status not in expected:
                      # Only fixed documented error codes; never echo arbitrary provider text.
                      allowed = {'1','3','1000','2009','2034','2062','2067','2072','2131','2198','4000','4001','4002','4003','4004','4005','4006','4050','4051','4292'}
                      causes = obj.get('cause')
                      if isinstance(causes, list):
                          seen = set()
                          for cause in causes[:20]:
                              if isinstance(cause, dict) and type(cause.get('code')) in (str, int):
                                  code = str(cause['code'])
                                  if code in allowed and code not in seen:
                                      print(stage + '_documented_error_code=' + code)
                                      seen.add(code)
                      stop(stage + '_http_failure_no_retry')
                  return obj
          
              seller = api('identity', 'GET', '/users/me')
              tags = seller.get('tags')
              if (not isinstance(tags, list) or not all(isinstance(x, str) for x in tags)
                      or 'test_user' not in tags or seller.get('site_id') != 'MLB'):
                  stop('brazil_test_seller_not_confirmed_no_post')
              seller_email = seller.get('email')
              if isinstance(seller_email, str) and seller_email.strip().casefold() == PAYER.casefold():
                  stop('payer_must_differ_from_seller_no_post')
              print('brazil_test_seller_confirmed=true')
              card = api('tokenization', 'POST', '/v1/card_tokens', {
                  'card_number':'5480832801033311', 'security_code':'123',
                  'expiration_month':11, 'expiration_year':2030,
                  'cardholder':{'name':'APRO','identification':{'type':'CPF','number':'12345678909'}}})
              report_mode('tokenization', card)
              if card.get('status') != 'active' or not isinstance(card.get('id'), str) or not card['id']:
                  stop('tokenization_not_active_no_payment')
              payment = api('payment', 'POST', '/v1/payments', {
                  'token':card['id'], 'transaction_amount':9.90, 'installments':1,
                  'payment_method_id':'master', 'description':'Official synthetic test payment',
                  'external_reference':reference,
                  'payer':{'email':PAYER,'identification':{'type':'CPF','number':'12345678909'}}})
              report_mode('payment', payment)
              identifier = payment.get('id')
              if type(identifier) not in (int, str) or not re.fullmatch(r'[0-9]+', str(identifier)):
                  stop('created_payment_id_invalid_no_retry')
              checked = api('readback','GET','/v1/payments/' + str(identifier))
              if (str(checked.get('id')) != str(identifier)
                      or checked.get('external_reference') != reference
                      or checked.get('currency_id') != 'BRL'
                      or type(checked.get('transaction_amount')) not in (int, float)
                      or checked['transaction_amount'] != 9.9):
                  stop('readback_mismatch_no_retry')
              report_mode('readback', checked)
              print('test_amount_brl=9.90')
              print('payment_approved=' + str(checked.get('status') == 'approved').lower())
              print('subscription_tested=false')
              if checked.get('status') != 'approved':
                  stop('single_synthetic_payment_not_approved_no_retry')
              print('result=single_synthetic_payment_readback_complete')
          
          
          if __name__ == '__main__':
              main()
          PYCODE
