name: Mercado Pago sandbox connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mp-sandbox-connectivity.yml']

permissions: {}

jobs:
  catalog-connectivity:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time sandbox connectivity 20261030T1049'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read payment methods catalog once
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN_ASSINATURA_DEV }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          # Fixed read-only destination; never accept workflow/user input URLs.
          url = "https://api.mercadopago.com/v1/payment_methods"
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme, parsed.hostname, parsed.port or 443, parsed.path,
              parsed.query, parsed.fragment) != (
                  "https", "api.mercadopago.com", 443,
                  "/v1/payment_methods", "", ""):
              sys.exit(1)

          token = os.environ.get("MP_ACCESS_TOKEN", "")
          print("secret_present=" + str(bool(token)).lower())
          if not token or "\r" in token or "\n" in token:
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          request = urllib.request.Request(
              url, method="GET", headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              })
          opener = urllib.request.build_opener(NoRedirect())
          try:
              response = opener.open(request, timeout=30)
          except urllib.error.HTTPError as error:
              # Read only bounded bytes; never emit provider text or request data.
              response = error
          except Exception:
              print("http_status=unavailable")
              sys.exit(1)

          try:
              with response:
                  status = response.status
                  mime = response.headers.get_content_type()
                  # Do not echo arbitrary response header values into public logs.
                  content_type = mime if mime in (
                      "application/json", "text/plain", "text/html"
                  ) else "other"
                  body = response.read(1024 * 1024 + 1)
          except Exception:
              print("http_status=unavailable")
              sys.exit(1)

          print("http_status=" + str(status))
          print("content_type=" + content_type)
          print("body_empty=" + str(not body).lower())
          if status != 200 or len(body) > 1024 * 1024:
              sys.exit(1)
          try:
              catalog = json.loads(body)
          except (ValueError, UnicodeError):
              sys.exit(1)
          if not isinstance(catalog, list) or not catalog:
              sys.exit(1)
          if not all(
              isinstance(item, dict)
              and isinstance(item.get("id"), str) and bool(item["id"])
              and isinstance(item.get("name"), str) and bool(item["name"])
              and isinstance(item.get("payment_type_id"), str)
              and bool(item["payment_type_id"])
              for item in catalog
          ):
              sys.exit(1)
          print("payment_methods_count=" + str(len(catalog)))
          PY
